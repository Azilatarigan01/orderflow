services:
  # 1. Backend Application Container (PHP 8.2 FPM + Composer + Laravel)
  app:
    build:
      context: ./orderflow_app
      dockerfile: Dockerfile
    container_name: orderflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./orderflow_app:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-orderflow}
      DB_USERNAME: ${DB_USERNAME:-orderflow_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password_change_me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - orderflow_network

  # 2. Web Server Container (Nginx Reverse Proxy)
  web:
    image: nginx:alpine
    container_name: orderflow_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./orderflow_app:/var/www/html:ro
      - ./orderflow_app/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - orderflow_network

  # 3. Database Container (MySQL 8.0 with Persistent Volume)
  db:
    image: mysql:8.0
    container_name: orderflow_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-orderflow}
      MYSQL_USER: ${DB_USERNAME:-orderflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_change_me}
    volumes:
      - orderflow_db_data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-orderflow_user}", "-p${DB_PASSWORD:-secret_password_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - orderflow_network

  # 4. Frontend Asset & Vite Container (Node.js 20 + React Engine)
  frontend:
    image: node:20-alpine
    container_name: orderflow_frontend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./orderflow_app:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run build && npm run dev -- --host 0.0.0.0"
    networks:
      - orderflow_network

# Persistent Volumes
volumes:
  orderflow_db_data:
    driver: local

# Internal Docker Network
networks:
  orderflow_network:
    driver: bridge
